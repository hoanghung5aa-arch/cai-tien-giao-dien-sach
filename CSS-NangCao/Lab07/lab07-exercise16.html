<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercise 7.16 - More transitions</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet">
    <link rel="stylesheet" href="lab07-exercise16.css">
</head>
<body>
    <header class="site-header">
        <h1>Share Your Travels</h1>
        <nav aria-label="Main navigation"><a href="#gallery">Photo gallery</a></nav>
    </header>
    <main>
        <p class="intro">Hover or focus a photo to transition its background, text, shadow, and scale.</p>
        <section id="gallery" class="gallery" aria-label="Travel photographs">
            <figure tabindex="0">
                <img src="images/224.jpg" alt="Historic castle on a rocky hillside">
                <figcaption>Battle Castle, UK</figcaption>
            </figure>
            <figure tabindex="0">
                <img src="images/776.jpg" alt="Sunset over the island of Santorini">
                <figcaption>Sunset, Santorini</figcaption>
            </figure>
            <figure tabindex="0">
                <img src="images/300.jpg" alt="Historic streets of Lucca, Italy">
                <figcaption>Lucca, Italy</figcaption>
            </figure>
            <figure tabindex="0">
                <img src="images/858.jpg" alt="Architecture in Verona, Italy">
                <figcaption>Verona, Italy</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
